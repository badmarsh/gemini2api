name: CI

# Quality gate: lint + automated tests on every push/PR. Complements
# docker-publish.yml (which only runs on version tags).
on:
  push:
    branches: ["main", "fix/**", "feat/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Hard quality gate: lint + tests BLOCK the workflow on failure so
      # regressions (failing tests, E9/F-class lint errors) cannot merge green.
      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest

  evals:
    name: Eval Suite (offline)
    runs-on: ubuntu-latest
    # The eval suite lives outside `testpaths` (pytest only collects `tests/`),
    # so it needs its own gate. It is fully offline: no upstream, no credentials.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run eval suite (pytest evals)
        run: pytest evals -q -p no:cacheprovider

  test-python-3-14:
    name: Test (Python 3.14, advisory)
    runs-on: ubuntu-latest
    # Python 3.14 could not be executed in the authoring sandbox (no `py`
    # launcher), so this job is advisory until a first green run is observed.
    # Promote it to a hard gate once the dependency set is proven on 3.14.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest

  dependency-audit:
    name: Dependency Audit (report-only)
    runs-on: ubuntu-latest
    # Non-blocking for now: surfaces known CVEs in pinned deps without failing
    # the build. Promote to a hard gate once the dependency baseline is clean.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt || true
