services:
  gemini2api:
    image: ghcr.io/xwteam/gemini2api:latest
    container_name: gemini2api
    # Starts as root, docker-entrypoint.sh repairs ownership of ./data and ./api volumes,
    # then drops privileges to run as non-root 'appuser'. No need to specify user:.
    env_file:
      - .env
    environment:
      - TZ=UTC
    ports:
      - "5918:5918"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5918/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Cookie refresher (optional): uses headless Chromium to periodically access Gemini Web,
  # triggering frontend JS token refresh for __Secure-1PSIDTS, then hot-updates the main
  # service cookies via the /admin API.
  # Not started by default; enable with `docker compose --profile refresher up -d`.
  refresher:
    build:
      context: ./refresher
      dockerfile: Dockerfile
    image: gemini2api-refresher:latest
    container_name: gemini2api-refresher
    profiles: ["refresher"]
    env_file:
      - .env
    environment:
      - TZ=UTC
      # Internal address of the main service (resolved by service name within Compose network).
      - GEMINI2API_URL=http://gemini2api:5918
      # Refresh interval in minutes (matches REFRESH_INTERVAL).
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-8}
      # /admin authentication: ADMIN_API_KEY / API_KEY from .env, must match main service.
    volumes:
      # Shared ./data directory: reads data/refresher_accounts.json, writes data/browser_states/.
      - ./data:/app/data
    depends_on:
      - gemini2api
    restart: unless-stopped
